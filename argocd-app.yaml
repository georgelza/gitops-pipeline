apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-gitops-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/georgelza/gitops-pipeline.git' # Replace with your repo
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc' # Points locally within the cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true