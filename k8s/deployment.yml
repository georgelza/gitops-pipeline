apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
  namespace: app
  labels:
    app: python-fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-fastapi
  template:
    metadata:
      labels:
        app: python-fastapi
    spec:
      containers:
      - name: fastapi-app
        image: georgelza/python-fastapi-app:54cd0592aa5e0f8a407f8de8032709093d0091e1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: app
spec:
  selector:
    app: python-fastapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: NodePort

---
apiVersion: v1
kind: Namespace
metadata:
  name: app2-space
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app2-deployment
  namespace: app2-space
  labels:
    app: python-fastapi-two
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-fastapi-two
  template:
    metadata:
      labels:
        app: python-fastapi-two
    spec:
      containers:
      - name: fastapi-app2
        # The runner will dynamically patch this placeholder just like App 1
        image: georgelza/python-fastapi-app2:placeholder
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9000
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9000
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: python-app2-service
  namespace: app2-space
spec:
  selector:
    app: python-fastapi-two
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
  type: NodePort